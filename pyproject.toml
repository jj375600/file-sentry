[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "file-sentry"
version = "1.0.0"
description = "A file-integrity monitor: baselines a directory tree, detects added/modified/deleted files and permission changes, and keeps a tamper-evident audit log."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jayden James" }]
dependencies = [
    "click>=8.1",
    "PyYAML>=6.0",
    "watchdog>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "types-PyYAML",
]

[project.scripts]
file-sentry = "file_sentry.cli:main"

[tool.setuptools.packages.find]
include = ["file_sentry*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
